name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Website – type-check, build, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high && (cd mobile && npm audit --omit=dev --audit-level=high)
      - run: npm run lint
      - run: npm run build
      - name: Install Playwright for browser tests
        run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm test

  android:
    name: Android app – debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Use the runner's pre-installed Android SDK
        run: echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV && yes | ${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - name: Install and sync
        working-directory: mobile
        env:
          FLOWRIDE_URL: ${{ vars.FLOWRIDE_URL || 'https://flowride.example.org' }}
        run: npm ci && npx cap sync android
      - name: Build APK
        working-directory: mobile/android
        # Retries ride out temporary GitHub download errors (Gradle is served from GitHub releases)
        run: for i in 1 2 3 4; do ./gradlew assembleDebug --no-daemon && exit 0; echo "Retry $i"; sleep $((i * 30)); done; exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: flowride-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS app – simulator build (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - name: Install and sync
        working-directory: mobile
        env:
          FLOWRIDE_URL: ${{ vars.FLOWRIDE_URL || 'https://flowride.example.org' }}
        run: npm ci && npx cap sync ios
      - name: Build for simulator
        working-directory: mobile/ios/App
        run: |
          # Clear a stale Swift package cache on the runner (Xcode "already exists in file system" bug)
          rm -rf ~/Library/Caches/org.swift.swiftpm ~/Library/org.swift.swiftpm
          for i in 1 2 3 4; do
            rm -rf ~/Library/Caches/org.swift.swiftpm
            xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App -clonedSourcePackagesDirPath build/spm && break
            [ $i = 4 ] && exit 1; echo "Retry $i"; sleep $((i * 30))
          done
          xcodebuild -clonedSourcePackagesDirPath build/spm -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Zip app
        run: cd mobile/ios/App/build/Build/Products/Debug-iphonesimulator && zip -qr $GITHUB_WORKSPACE/FlowRide-simulator.zip App.app
      - uses: actions/upload-artifact@v7
        with:
          name: flowride-ios-simulator
          path: FlowRide-simulator.zip

  deploy:
    name: Deploy to Oracle Cloud
    needs: web
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/repo-comparison-testing-jrdgtb')
    runs-on: ubuntu-latest
    concurrency: { group: deploy-oracle, cancel-in-progress: false }
    env:
      OCI_HOST: ${{ secrets.OCI_HOST }}
      OCI_USER: ${{ secrets.OCI_USER || 'ubuntu' }}
    steps:
      - name: Check deployment secrets
        id: check
        env:
          HAS_KEY: ${{ secrets.OCI_SSH_KEY != '' }}
          HAS_ADMIN: ${{ secrets.ADMIN_TOKEN != '' }}
          HAS_DATA_KEY: ${{ secrets.DATA_KEY != '' }}
        run: |
          if [ -n "$OCI_HOST" ] && [ "$HAS_KEY" = true ] && [ "$HAS_ADMIN" = true ] && [ "$HAS_DATA_KEY" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping deploy: add OCI_HOST, OCI_SSH_KEY, ADMIN_TOKEN and DATA_KEY secrets (see docs/ORACLE.md)."
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with: { node-version: 22, cache: npm }
      - name: Build release
        if: steps.check.outputs.ready == 'true'
        run: npm ci && npm run release && tar -czf release.tgz -C release .
      - name: Set up SSH
        if: steps.check.outputs.ready == 'true'
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_HOST_KEY: ${{ secrets.OCI_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$OCI_HOST_KEY" ]; then
            printf '%s %s\n' "$OCI_HOST" "$OCI_HOST_KEY" > ~/.ssh/known_hosts   # pinned host key (recommended)
          else
            echo "::warning::OCI_HOST_KEY not set; trusting the server's key on first use."
            ssh-keyscan -T 15 -t ed25519 "$OCI_HOST" > ~/.ssh/known_hosts
          fi
          printf 'Host oci\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 20\n' "$OCI_HOST" "$OCI_USER" > ~/.ssh/config
      - name: Upload and set up server
        if: steps.check.outputs.ready == 'true'
        run: |
          scp -q release.tgz deploy/setup-server.sh deploy/deploy.sh oci:/tmp/
          ssh oci 'sudo bash /tmp/setup-server.sh'
      - name: Write app settings (secrets never touch the disk on this runner or the command line)
        if: steps.check.outputs.ready == 'true'
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          CONTROLLER_NAME: ${{ secrets.CONTROLLER_NAME }}
          PRIVACY_EMAIL: ${{ secrets.PRIVACY_EMAIL }}
          SECURITY_EMAIL: ${{ secrets.SECURITY_EMAIL }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
        run: |
          domain="${SITE_DOMAIN:-$(echo "$OCI_HOST" | tr . -).sslip.io}"
          echo "SITE=$domain" >> "$GITHUB_ENV"
          q() { printf '%s="%s"\n' "$1" "$(printf '%s' "$2" | sed 's/\\/\\\\/g; s/"/\\"/g')"; }
          { q ADMIN_TOKEN "$ADMIN_TOKEN"; q DATA_KEY "$DATA_KEY"; q CONTROLLER_NAME "$CONTROLLER_NAME"
            q PRIVACY_EMAIL "$PRIVACY_EMAIL"; q SECURITY_EMAIL "$SECURITY_EMAIL"; q PUBLIC_URL "https://$domain"; } \
            | ssh oci 'sudo install -m 600 -o root -g root /dev/stdin /etc/flowride/flowride.env'
      - name: Deploy (rolls back automatically if unhealthy)
        if: steps.check.outputs.ready == 'true'
        run: ssh oci "sudo bash /tmp/deploy.sh /tmp/release.tgz ${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER} $SITE"
      - name: Check the live site
        if: steps.check.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5 6; do curl -fsS "https://$SITE/api/config" >/dev/null && { echo "Live at https://$SITE"; exit 0; }; sleep 10; done
          echo "::warning::Deployed, but https://$SITE is not reachable yet. Check the OCI security list allows ports 80 and 443."
